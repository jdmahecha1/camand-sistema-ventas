<div class="card">
  <div class="card-header">
    <h3 class="card-title">Listado de Usuarios</h3>
    <div class="card-tools">
      <button class="btn btn-warning btn-sm" (click)="nuevo()">
        <i class="fas fa-plus"></i> Insertar Usuario
      </button>
    </div>
  </div>

  <div class="card-body" *ngIf="mostrarForm">
    <form (ngSubmit)="guardar()" #f="ngForm" class="row">
      <div class="form-group col-md-4">
        <label>Nombre</label>
        <input type="text" class="form-control" name="nombre" [(ngModel)]="nombre" required>
      </div>
      <div class="form-group col-md-4">
        <label>Correo</label>
        <input type="email" class="form-control" name="correo" [(ngModel)]="correo" required>
      </div>
      <div class="form-group col-md-2">
        <label>Contraseña</label>
        <input type="text" class="form-control" name="clave" [(ngModel)]="clave" required>
      </div>
      <div class="form-group col-md-2">
        <label>Rol</label>
        <select class="form-control" name="rol" [(ngModel)]="rol">
          <option value="cliente">Cliente</option>
          <option value="admin">Administrador</option>
        </select>
      </div>
      <div class="col-md-12 mt-2">
        <button type="submit" class="btn btn-primary mr-2">{{ modoEditar ? 'Actualizar' : 'Guardar' }}</button>
        <button type="button" class="btn btn-secondary" (click)="cancelar()">Cancelar</button>
      </div>
    </form>
    <hr>
  </div>

  <div class="card-body table-responsive p-0">
    <table class="table table-hover text-nowrap">
      <thead>
        <tr>
          <th>Nombre</th>
          <th>Correo</th>
          <th>Rol</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let item of usuarios">
          <td>{{ item.nombre }}</td>
          <td>{{ item.correo }}</td>
          <td>
            <span class="badge" [class.badge-primary]="item.rol === 'admin'" [class.badge-secondary]="item.rol !== 'admin'">
              {{ item.rol === 'admin' ? 'Administrador' : 'Cliente' }}
            </span>
          </td>
          <td>
            <button class="btn btn-info btn-sm" (click)="seleccionar(item)" title="Editar">
              <i class="fas fa-edit"></i>
            </button>
            <button
              class="btn btn-danger btn-sm"
              (click)="eliminar(item)"
              title="Eliminar"
              [disabled]="item.idusuario === miPropioId">
              <i class="fas fa-trash"></i>
            </button>
          </td>
        </tr>
        <tr *ngIf="usuarios.length === 0">
          <td colspan="4" class="text-center">No hay usuarios registrados</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
