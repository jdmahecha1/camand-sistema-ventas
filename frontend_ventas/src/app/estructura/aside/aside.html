<aside class="main-sidebar sidebar-dark-primary elevation-4">
    <!-- Brand Logo -->
    <a routerLink="/dashboard" class="brand-link">
      <img src="../assets/dist/img/AdminLTELogo.png" alt="CAMAND" class="brand-image img-circle elevation-3" style="opacity: .85">
      <span class="brand-text">CAMAND</span>
    </a>

    <!-- Sidebar -->
    <div class="sidebar">
      <!-- Sidebar user panel -->
      <div class="user-panel mt-3 pb-3 mb-3 d-flex">
        <div class="image">
          <i class="fas fa-user-circle" style="font-size: 2rem; color: rgba(255,255,255,0.55);"></i>
        </div>
        <div class="info">
          <a href="#" class="d-block">{{ usuario?.nombre || 'Usuario' }}</a>
        </div>
      </div>
        <!-- Sidebar Menu -->
      <nav class="mt-2">
        <ul class="nav nav-pills nav-sidebar flex-column" data-widget="treeview" role="menu" data-accordion="false">

          <li class="nav-item">
            <a [routerLink]="['/dashboard']" routerLinkActive="active" class="nav-link">
              <i class="nav-icon fas fa-tachometer-alt"></i>
              <p>Dashboard</p>
            </a>
          </li>
          <li class="nav-item">
            <a [routerLink]="['/categoria']" routerLinkActive="active" class="nav-link">
              <i class="nav-icon fas fa-tags"></i>
              <p>Categorías</p>
            </a>
          </li>
          <li class="nav-item">
            <a [routerLink]="['/producto']" routerLinkActive="active" class="nav-link">
              <i class="nav-icon fas fa-boxes"></i>
              <p>Productos</p>
            </a>
          </li>
          <li class="nav-item">
            <a [routerLink]="['/cliente']" routerLinkActive="active" class="nav-link">
              <i class="nav-icon fas fa-users"></i>
              <p>Clientes</p>
            </a>
          </li>
          <li class="nav-item">
            <a [routerLink]="['/pedido']" routerLinkActive="active" class="nav-link">
              <i class="nav-icon fas fa-shopping-cart"></i>
              <p>Pedidos</p>
            </a>
          </li>
          <li class="nav-item">
            <a [routerLink]="['/usuario']" routerLinkActive="active" class="nav-link">
              <i class="nav-icon fas fa-user-shield"></i>
              <p>Usuarios</p>
            </a>
          </li>
        </ul>
      </nav>
      <!-- /.sidebar-menu -->
    </div>
    <!-- /.sidebar -->
  </aside>
